<title>Mahalla xizmatlari</title>
<style>
:root{--pri:#16a34a;--pri2:#15803d;--soft:#dcfce7;--bg:#f2f5f3;--card:#fff;--txt:#101828;
--mut:#667085;--line:#e4e7ec;--red:#d92d20;--amber:#f59e0b;
--sh:0 1px 2px rgba(16,24,40,.05),0 8px 20px rgba(16,24,40,.07)}
@media(prefers-color-scheme:dark){:root{--soft:#12301e;--bg:#0a0e0c;--card:#141917;--txt:#f2f4f7;
--mut:#98a2b3;--line:#252c28;--sh:0 0 0 1px #1e2521}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);
color:var(--txt);line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom));
-webkit-font-smoothing:antialiased}
a{color:inherit}
svg{flex:none;vertical-align:middle}
.app{max-width:560px;margin:0 auto}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
.bar h1{font-size:18px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{color:#fff;display:flex;padding:6px;margin-left:-8px;border-radius:50%;text-decoration:none}
.ib:active{background:rgba(255,255,255,.18)}
main{padding:14px 16px;animation:in .28s ease both}main.flush{padding:0}.pad{padding:14px 16px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main{animation:none}*{transition:none!important}}
.hero{position:relative;overflow:hidden;color:#fff;padding:18px 16px 26px;
padding-top:calc(18px + env(safe-area-inset-top));border-radius:0 0 30px 30px;
background:radial-gradient(circle at 88% 10%,rgba(255,255,255,.22),transparent 38%),
radial-gradient(circle at 5% 100%,rgba(0,0,0,.16),transparent 45%),
linear-gradient(135deg,var(--pri2),var(--pri))}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:9px}

function phoneFmt(p) { return /^\d{9}$/.test(p) ? '+998 ' + p.slice(0, 2) + ' ' + p.slice(2, 5) + ' ' + p.slice(5, 7) + ' ' + p.slice(7) : p; }
function cleanPhone(p) { return String(p || '').replace(/\D/g, '').slice(-9); }
function stars(n, s) { var o = ''; for (var i = 0; i < n; i++) o += ic('star', s || 14); return '<span class="stars">' + o + '</span>'; }
function av(n, cls) { return '<div class="av ' + (cls || '') + '" style="background:hsl(' + hue(n) + ' 55% 42%)">' + esc(initials(n)) + '</div>'; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function nowS() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function hp(s) {
  var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function pwHash(p) { return hp('mh1:' + p); }
function emptyState(icon, title, text, action) {
  return '<div class="empty"><div class="ci">' + ic(icon, 34) + '</div><b>' + title + '</b><p>' + text + '</p>' + (action || '') + '</div>';
}

/* ============ MA'LUMOTLAR OMBORI (localStorage) ============ */
var memCopy = null;
function load() {
  try { var r = localStorage.getItem(STORE_KEY); if (r) return JSON.parse(r); } catch (e) {}
  return memCopy;
}
function save() {
  memCopy = DB;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) {}
}
function seed() {
  var d = {seq: {u: 0, o: 0, r: 0}, users: [], masters: {}, orders: [], reports: [], session: null};
  function add(name, phone, pw, role) {
    var u = {id: ++d.seq.u, name: name, phone: phone, pw: pwHash(pw), role: role, blocked: 0, deleted: 0, created: nowS()};
    d.users.push(u); return u;
  }
  add('Admin', '900000000', 'admin123', 'admin');
  var cl = add('Demo Mijoz', '911000100', 'demo123', 'client');
  DEMO.forEach(function (m, i) {
    var u = add(m[0], m[1], 'demo123', 'master');
    d.masters[u.id] = {category: m[2], district: m[3], price: m[4], about: m[5], available: i === 5 ? 0 : 1};
    for (var k = 0; k < 2 + i % 3; k++) {
      var rv = DEMO_REV[(i + k) % DEMO_REV.length];
      d.orders.push({id: ++d.seq.o, clientId: cl.id, masterId: u.id, desc: 'Demo buyurtma', addr: 'Demo manzil', price: m[4], status: 'done', rating: rv[0], review: rv[1], when: '', created: nowS()});
    }
  });
  return d;
}
var DB = load() || seed();
save();

function userById(id) { return DB.users.filter(function (u) { return u.id === id; })[0]; }
function me() {
  var u = userById(DB.session);
  if (u && (u.blocked || u.deleted)) { DB.session = null; save(); return null; }
  return u || null;
}
function mstats(id) {
  var rs = DB.orders.filter(function (o) { return o.masterId === id && o.rating != null; });
  var avg = rs.length ? Math.round(rs.reduce(function (a, o) { return a + o.rating; }, 0) / rs.length * 10) / 10 : null;
  return {avg: avg, nrev: rs.length, jobs: DB.orders.filter(function (o) { return o.masterId === id && o.status === 'done'; }).length};
}
function masterRow(u) { return Object.assign({id: u.id, name: u.name, phone: u.phone}, DB.masters[u.id], mstats(u.id)); }
function visibleMasters() {
  return DB.users.filter(function (u) { return u.role === 'master' && !u.blocked && !u.deleted && DB.masters[u.id]; }).map(masterRow);
}

  Object.keys(o).forEach(function (k) { if (o[k]) p.set(k, o[k]); });
  var s = p.toString();
  return '#/' + (s ? '?' + s : '');
}

  });

    '<div class="hero"><div class="brand"><span class="mk">' + ic('logo', 22) + '</span> Mahalla</div>' +
    '<h2>' + (u ? 'Salom, ' + esc(u.name.split(' ')[0]) : 'Ustani mahallangizdan toping') + '</h2>' +

function orderCard(o, u) {
  var otherId = u.role === 'client' ? o.masterId : o.clientId, other = userById(otherId) || {name: '?', phone: ''};
  var step = o.status === 'new' ? 0 : o.status === 'accepted' ? 1 : o.status === 'done' ? 2 : -1;
  var h = '<div class="card"><div class="between"><div class="g8">' + av(other.name, 'sm') + '<div><b>' + esc(short(other.name)) + '</b><div class="muted">#' + o.id + ' &middot; ' + esc(o.created) + '</div></div></div>' +
    '<span class="pill st-' + o.status + '">' + STATUS[o.status] + '</span></div><p>' + esc(o.desc) + '</p>' +
    '<div class="meta"><span>' + ic('pin', 15) + esc(o.addr) + '</span>' + (o.when ? '<span>' + ic('clock', 15) + esc(o.when) + '</span>' : '') + '<span><b style="color:var(--txt)">' + som(o.price) + '</b></span></div>';
  if (o.status !== 'cancelled') {
    h += '<div class="steps">' + ['Yuborildi', 'Qabul', 'Bajarildi'].map(function (l, i) { return '<div class="stp ' + (i <= step ? 'on' : '') + '"><i></i>' + l + '</div>'; }).join('') + '</div>';
  }
  if ((o.status === 'accepted' || o.status === 'done') && /^\d{9}$/.test(other.phone)) {
    h += '<a class="btn ghost" href="tel:+998' + other.phone + '">' + ic('phone', 18) + ' ' + phoneFmt(other.phone) + '</a>';
  }
  if (u.role === 'master') {
    h += '<div class="row">';
    if (o.status === 'new') h += '<button class="btn" data-act="accept" data-id="' + o.id + '">Qabul qilish</button>';
    if (o.status === 'accepted') h += '<button class="btn" data-act="done" data-id="' + o.id + '">Bajarildi</button>';
    if (o.status === 'new' || o.status === 'accepted') h += '<button class="btn line" data-act="cancel" data-id="' + o.id + '">Bekor qilish</button>';
    h += '</div>';
    if (o.rating) h += '<div class="muted g8" style="margin-top:6px">Baho: ' + stars(o.rating) + (o.review ? ' &middot; "' + esc(o.review) + '"' : '') + '</div>';
  } else {
    if (o.status === 'new') h += '<button class="btn line" data-act="cancel" data-id="' + o.id + '">Bekor qilish</button>';
    else if (o.status === 'done' && o.rating == null) {
      h += '<form data-form="rate" data-id="' + o.id + '" style="margin-top:8px"><div class="lbl center">Ishdan qoniqdingizmi? Baho bering</div><div class="rate">' +
        [5, 4, 3, 2, 1].map(function (n) { return '<input type="radio" name="rating" id="r' + n + '-' + o.id + '" value="' + n + '" ' + (n === 5 ? 'checked' : '') + '><label for="r' + n + '-' + o.id + '">' + ic('star', 38) + '</label>'; }).join('') +
        '</div><input name="review" placeholder="Fikringiz (ixtiyoriy)" maxlength="500"><button class="btn">Yuborish</button></form>';
    } else if (o.rating) h += '<div class="muted g8" style="margin-top:6px">Sizning bahoyingiz: ' + stars(o.rating) + '</div>';
  }
  return h + '</div>';
}

    '<div class="card center">' + av(u.name, 'lg') + '<h2 style="margin:4px 0">' + esc(u.name) + '</h2><div class="muted">' + phoneFmt(u.phone) + '</div><p><span class="pill st-done">' + roles[u.role] + '</span></p></div>' +
    '<form class="card" data-form="profile"><b>Ma\'lumotlarni tahrirlash</b>' +
    '<label class="lbl">Ism familiya</label><input name="name" value="' + esc(u.name) + '" maxlength="60">' +
    (m ? '<label class="lbl">Xizmat turi</label><select name="category">' + CATEGORIES.map(function (c) { return '<option ' + (c === m.category ? 'selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
      '<label class="lbl">Mahalla / tuman</label><input name="district" value="' + esc(m.district) + '" maxlength="60">' +
      '<label class="lbl">Boshlang\'ich narx (so\'m)</label><input name="price" type="number" inputmode="numeric" value="' + m.price + '" min="0">' +
      '<label class="lbl">O\'zingiz haqingizda</label><textarea name="about" maxlength="600">' + esc(m.about) + '</textarea>' : '') +
    '<label class="lbl">Yangi parol (o\'zgartirmoqchi bo\'lsangiz)</label><input name="new_password" type="password" placeholder="Kamida 6 belgi">' +
    '<button class="btn">Saqlash</button></form>' +
    '<div class="card" style="padding:4px 16px"><a class="lnk" href="#/privacy"><span>' + ic('lock', 20) + ' Maxfiylik siyosati</span>' + ic('chev', 18) + '</a>' +
    (u.role !== 'admin' ? '<a class="lnk" href="#/delete" style="color:var(--red)"><span>' + ic('trash', 20) + ' Akkauntni o\'chirish</span>' + ic('chev', 18) + '</a>' : '') + '</div>' +
    '<button class="btn line" data-act="logout">' + ic('logout', 20) + ' Chiqish</button>' +
    '<p class="center muted" style="margin-top:14px">Mahalla xizmatlari &middot; versiya ' + APP_VERSION + '</p>'};
}

function vDelete() {
  return {active: 'profile', title: "Akkauntni o'chirish", back: '#/profile', html:
    '<div class="card"><div class="warn" style="background:#fee2e2;color:#7f1d1d">' + ic('alert', 20) + '<div>Bu amalni qaytarib bo\'lmaydi.</div></div>' +
    '<p>Akkauntni o\'chirsangiz:</p><ul class="doc" style="padding-left:20px"><li>ism, telefon raqam va parolingiz o\'chiriladi;</li><li>faol buyurtmalaringiz bekor qilinadi;</li><li>usta bo\'lsangiz, profilingiz ro\'yxatdan olib tashlanadi;</li><li>buyurtma manzillari va tavsiflari anonim qilinadi.</li></ul>' +
    '<form data-form="delete"><label class="lbl">Tasdiqlash uchun parolingizni kiriting</label><input name="password" type="password" placeholder="Parol" required>' +
    '<button class="btn red">' + ic('trash', 20) + ' Akkauntni o\'chirish</button></form><a class="btn line" href="#/profile">Bekor qilish</a></div>'};
}

function vPrivacy(u) {
  return {active: u ? 'profile' : 'home', title: 'Maxfiylik siyosati', back: '#/', html:
    '<div class="card doc"><p class="muted">Oxirgi yangilanish: 2026-10-15</p>' +
    '<h3>Umumiy</h3><p>"Mahalla xizmatlari" mijozlarni mahalliy ustalar bilan bog\'laydi. Bu sahifada qanday ma\'lumot saqlanishi tushuntirilgan.</p>' +
    '<h3>Qanday ma\'lumot saqlanadi</h3><ul><li>Ism va telefon raqam.</li><li>Parol (shifrlangan ko\'rinishda).</li><li>Usta uchun: xizmat turi, mahalla, narx va o\'zi haqida matn.</li><li>Buyurtmalar: ish tavsifi, manzil, vaqt, holat, baho va sharh.</li></ul>' +
    '<h3>Qayerda saqlanadi</h3><p>Hamma ma\'lumot faqat shu qurilmada, ilovaning ichki xotirasida saqlanadi. U internet orqali hech qayerga yuborilmaydi va uchinchi shaxslarga berilmaydi. Reklama yoki kuzatuv yo\'q.</p>' +
    '<h3>O\'chirish</h3><p>Akkauntni istalgan payt o\'chirishingiz mumkin: Profil &rarr; Akkauntni o\'chirish. Ilovani o\'chirib tashlasangiz, barcha ma\'lumot qurilmadan yo\'qoladi.</p>' +
    '<h3>Shikoyat</h3><p>Nomaqbul usta yoki sharh haqida ilova ichida shikoyat qilishingiz mumkin.</p>' +
    '<h3>Aloqa</h3><p>Savollar uchun: <b>' + esc(CONTACT_EMAIL) + '</b></p></div>'};
}

function vAdmin(u) {
  var cl = DB.users.filter(function (x) { return x.role === 'client' && !x.deleted; }).length;
  var ms = DB.users.filter(function (x) { return x.role === 'master' && !x.deleted; }).length;
  var done = DB.orders.filter(function (o) { return o.status === 'done'; });
  var turnover = done.reduce(function (a, o) { return a + o.price; }, 0);
  var reps = DB.reports.filter(function (r) { return r.status === 'open'; }).sort(function (a, b) { return b.id - a.id; }).slice(0, 20);
  var users = DB.users.filter(function (x) { return x.role !== 'admin' && !x.deleted; }).sort(function (a, b) { return b.id - a.id; }).slice(0, 30);
  var recent = DB.orders.slice().sort(function (a, b) { return b.id - a.id; }).slice(0, 15);
  var defPw = u.pw === pwHash('admin123');
  var repHtml = reps.map(function (r) {
    var tname = '-', text = '';
    if (r.kind === 'master') { var t = userById(r.target); tname = t ? t.name : '-'; }
    else { var o = DB.orders.filter(function (x) { return x.id === r.target; })[0]; if (o) { var mm = userById(o.masterId); tname = mm ? mm.name : '-'; text = o.review || ''; } }
    var rp = userById(r.reporter);
    return '<div class="card"><div class="between"><b>' + (r.kind === 'master' ? 'Usta' : 'Sharh') + ': ' + esc(tname) + '</b><span class="muted">#' + r.id + '</span></div>' +
      '<div class="muted">' + esc(r.reason) + ' &middot; ' + esc(short(rp ? rp.name : '')) + ' &middot; ' + esc(r.created) + '</div>' +
      (r.kind === 'review' ? '<p>"' + esc(text || "(matn yo'q)") + '"</p>' : '') +
      '<div class="row" style="margin-top:8px">' + (r.kind === 'master' ? '<button class="btn red" data-act="repBlock" data-id="' + r.id + '">Ustani bloklash</button>' : '<button class="btn red" data-act="repClear" data-id="' + r.id + '">Sharhni o\'chirish</button>') +
      '<button class="btn line" data-act="repClose" data-id="' + r.id + '">Yopish</button></div></div>';
  }).join('') || '<p class="muted">Ochiq shikoyat yo\'q.</p>';
  var usHtml = users.map(function (x) {
    return '<div class="card between"><div class="g8">' + av(x.name, 'sm') + '<div><b>' + esc(short(x.name)) + '</b><div class="muted">' + phoneFmt(x.phone) + ' &middot; ' + (x.role === 'master' ? 'Usta' : 'Mijoz') + '</div></div></div>' +
      '<button class="btn sm ' + (x.blocked ? 'ghost' : 'line') + '" data-act="ublock" data-id="' + x.id + '">' + (x.blocked ? 'Blokdan chiqarish' : 'Bloklash') + '</button></div>';
  }).join('') || '<p class="muted">Hozircha foydalanuvchi yo\'q.</p>';
  var recHtml = recent.map(function (o) {
    var c = userById(o.clientId), m = userById(o.masterId);
    return '<div class="card"><div class="between"><b>#' + o.id + ' &middot; ' + som(o.price) + '</b><span class="pill st-' + o.status + '">' + STATUS[o.status] + '</span></div><div class="muted">' + esc(short(c ? c.name : '')) + ' &rarr; ' + esc(short(m ? m.name : '')) + ' &middot; ' + esc(o.created) + '</div></div>';
  }).join('') || '<p class="muted">Hozircha buyurtma yo\'q.</p>';
  return {active: 'admin', title: 'Admin panel', html:
    (defPw ? '<div class="warn">' + ic('alert', 20) + '<div>Admin paroli hali standart. <a href="#/profile">Profil</a> bo\'limida o\'zgartiring.</div></div>' : '') +
    '<div class="grid"><div class="stat"><b>' + cl + '</b><span>Mijozlar</span></div><div class="stat"><b>' + ms + '</b><span>Ustalar</span></div>' +
    '<div class="stat"><b>' + DB.orders.length + '</b><span>Buyurtmalar</span></div><div class="stat"><b>' + done.length + '</b><span>Bajarilgan</span></div>' +
    '<div class="stat"><b>' + som(turnover) + '</b><span>Aylanma</span></div><div class="stat"><b>' + som(turnover * COMMISSION) + '</b><span>Daromad (' + Math.round(COMMISSION * 100) + '%)</span></div></div>' +
    '<button class="btn ghost" data-act="reset">' + ic('plus', 20) + ' Demo ma\'lumotlarni tiklash</button>' +
    '<h3 style="margin:18px 0 10px">Shikoyatlar (' + reps.length + ')</h3>' + repHtml +
    '<h3 style="margin:18px 0 10px">Foydalanuvchilar</h3>' + usHtml +
    '<h3 style="margin:18px 0 10px">So\'nggi buyurtmalar</h3>' + recHtml};
}

function v404() {
  return {active: 'home', title: 'Topilmadi', back: '#/', html: emptyState('search', 'Sahifa topilmadi', "Manzil noto'g'ri yoki sahifa o'chirilgan.", '<a class="btn sm" href="#/">Bosh sahifa</a>')};
}

/* ============ SHAKL VA YO'NALTIRISH ============ */
function navItems(u) {
  if (!u) return [['home', 'Bosh', '#/', 'home'], ['login', 'Kirish', '#/login', 'user'], ['register', "Ro'yxat", '#/register', 'plus']];
  if (u.role === 'admin') return [['admin', 'Admin', '#/admin', 'grid'], ['home', 'Ustalar', '#/', 'search'], ['profile', 'Profil', '#/profile', 'user']];
  if (u.role === 'master') return [['orders', 'Buyurtmalar', '#/orders', 'list'], ['home', 'Ustalar', '#/', 'search'], ['profile', 'Profil', '#/profile', 'user']];
  return [['home', 'Bosh', '#/', 'home'], ['orders', 'Buyurtmalar', '#/orders', 'list'], ['profile', 'Profil', '#/profile', 'user']];
}
function shell(v, u) {
  var bar = v.hideBar ? '' : '<header class="bar">' + (v.back ? '<a class="ib" href="' + v.back + '" aria-label="Orqaga">' + ic('back', 24) + '</a>' : '') + '<h1>' + esc(v.title || 'Mahalla') + '</h1></header>';
  var tabs = '<nav class="tabs"><div class="in">' + navItems(u).map(function (n) {
    return '<a href="' + n[2] + '" class="' + (n[0] === v.active ? 'on' : '') + '">' + ic(n[3], 24) + '<span>' + n[1] + '</span></a>';
  }).join('') + '</div></nav>';
  return bar + '<main class="' + (v.flush ? 'flush' : '') + '">' + v.html + '</main>' + tabs;
}
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3800);
}
function need(u, roles, hash) {
  if (!u) return {redirect: '#/login?next=' + encodeURIComponent(hash), toast: 'Avval tizimga kiring.'};
  if (roles && roles.indexOf(u.role) < 0) return {redirect: '#/', toast: "Bu sahifaga ruxsat yo'q."};
  return null;
}
function route(seg, q, u, hash) {
  var g, a = seg[0] || '';
  if (a === '') return vHome(q, u);
  if (a === 'usta') return vMaster(+seg[1], u);
  if (a === 'order') { g = need(u, ['client'], hash); return g || vOrderForm(+seg[1], u); }
  if (a === 'login') return vLogin(q);
  if (a === 'register') return vRegister(q);
  if (a === 'orders') { g = need(u, ['client', 'master'], hash); if (g) return g; return vOrders(q, u); }
  if (a === 'profile') { g = need(u, null, hash); return g || vProfile(u); }
  if (a === 'delete') { g = need(u, ['client', 'master'], hash); return g || vDelete(); }
  if (a === 'admin') { g = need(u, ['admin'], hash); return g || vAdmin(u); }
  if (a === 'privacy') return vPrivacy(u);
  return v404();
}
function render() {
  var hash = location.hash || '#/', h = hash.slice(1), qi = h.indexOf('?');
  var path = qi < 0 ? h : h.slice(0, qi), q = new URLSearchParams(qi < 0 ? '' : h.slice(qi + 1));
  var seg = path.split('/').filter(Boolean), u = me(), v;
  try { v = route(seg, q, u, hash); } catch (e) {
    if (window.console) console.error(e);
    v = {active: 'home', title: 'Xatolik', back: '#/', html: emptyState('alert', 'Nimadir xato ketdi', "Qayta urinib ko'ring.", '<a class="btn sm" href="#/">Bosh sahifa</a>')};
  }
  if (v.redirect) { if (v.toast) toast(v.toast); location.replace(v.redirect); return; }
  document.getElementById('app').innerHTML = shell(v, u);
  document.title = (v.title ? v.title + ' - ' : '') + 'Mahalla';
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

/* ============ AMALLAR ============ */
function orderById(id) { return DB.orders.filter(function (o) { return o.id === +id; })[0]; }
function afterLogin(next) { go(next && next.charAt(0) === '#' ? next : '#/' + (me() && me().role === 'admin' ? 'admin' : me() && me().role === 'master' ? 'orders' : '')); }
function toInt(v, d, lo, hi) { var n = parseInt(v, 10); if (isNaN(n)) return d; return Math.max(lo, Math.min(hi, n)); }

function onForm(name, f, fd, ds) {
  var u = me();
  if (name === 'search') { go(hq({q: String(fd.get('q') || '').trim(), cat: fd.get('cat')})); return; }
  if (name === 'login') {
    var phone = cleanPhone(fd.get('phone')), pw = String(fd.get('password') || '');
    var x = DB.users.filter(function (z) { return z.phone === phone && !z.deleted; })[0];
    if (!x || x.pw !== pwHash(pw)) return toast("Telefon yoki parol noto'g'ri.");
    if (x.blocked) return toast('Akkaunt bloklangan. Murojaat: ' + CONTACT_EMAIL);
    DB.session = x.id; save(); afterLogin(ds.next); return;
  }
  if (name === 'register') {
    var nm = String(fd.get('name') || '').trim().slice(0, 60), ph = cleanPhone(fd.get('phone')), pw2 = String(fd.get('password') || '');
    var role = fd.get('role') === 'master' ? 'master' : 'client';
    if (!nm || ph.length !== 9 || pw2.length < 6) return toast('Ism, 9 xonali telefon va kamida 6 belgili parol kiriting.');
    if (DB.users.some(function (z) { return z.phone === ph; })) return toast("Bu telefon raqam allaqachon ro'yxatdan o'tgan.");
    var nu = {id: ++DB.seq.u, name: nm, phone: ph, pw: pwHash(pw2), role: role, blocked: 0, deleted: 0, created: nowS()};
    DB.users.push(nu);
    if (role === 'master') {
      var cat = String(fd.get('category') || ''); if (CATEGORIES.indexOf(cat) < 0) cat = CATEGORIES[0];
      DB.masters[nu.id] = {category: cat, district: String(fd.get('district') || '').trim().slice(0, 60) || 'Markaz', price: toInt(fd.get('price'), 0, 0, 1e9), about: String(fd.get('about') || '').trim().slice(0, 600), available: 1};
    }
    DB.session = nu.id; save(); toast('Xush kelibsiz!'); afterLogin(ds.next); return;
  }
  if (!u) return toast('Avval tizimga kiring.');
  if (name === 'order') {
    var mid = +ds.master, mu = userById(mid), mm = DB.masters[mid];
    if (u.role !== 'client' || !mu || !mm || mu.blocked || mu.deleted) return toast('Usta topilmadi.');
    if (!mm.available) return toast('Usta hozir band.');
    var desc = String(fd.get('description') || '').trim().slice(0, 1000), addr = String(fd.get('address') || '').trim().slice(0, 200), when = String(fd.get('when') || '');
    if (!desc || !addr) return toast('Muammo va manzilni yozing.');
    if (WHEN.indexOf(when) < 0) when = WHEN[0];
    DB.orders.push({id: ++DB.seq.o, clientId: u.id, masterId: mid, desc: desc, addr: addr, price: mm.price, status: 'new', rating: null, review: null, when: when, created: nowS()});
    save(); toast('Buyurtma yuborildi. Usta tez orada javob beradi.'); go('#/orders'); return;
  }
  if (name === 'rate') {
    var o = orderById(ds.id);
    if (o && o.clientId === u.id && o.status === 'done' && o.rating == null) {
      o.rating = toInt(fd.get('rating'), 5, 1, 5); o.review = String(fd.get('review') || '').trim().slice(0, 500) || null;
      save(); toast('Bahoyingiz uchun rahmat!'); go('#/orders?tab=history');
    }
    return;
  }
  if (name === 'profile') {
    u.name = String(fd.get('name') || '').trim().slice(0, 60) || u.name;
    var np = String(fd.get('new_password') || '');
    if (np) { if (np.length < 6) return toast("Yangi parol kamida 6 belgi bo'lsin."); u.pw = pwHash(np); }
    var m = DB.masters[u.id];
    if (m) {
      var c2 = String(fd.get('category') || ''); if (CATEGORIES.indexOf(c2) >= 0) m.category = c2;
      m.district = String(fd.get('district') || '').trim().slice(0, 60) || m.district;
      m.price = toInt(fd.get('price'), m.price, 0, 1e9);
      m.about = String(fd.get('about') || '').trim().slice(0, 600);
    }
    save(); toast('Saqlandi.'); render(); return;
  }
  if (name === 'delete') {
    if (u.role === 'admin' || u.pw !== pwHash(String(fd.get('password') || ''))) return toast("Parol noto'g'ri.");
    DB.orders.forEach(function (o) {
      if ((o.clientId === u.id || o.masterId === u.id) && (o.status === 'new' || o.status === 'accepted')) o.status = 'cancelled';
      if (o.clientId === u.id) { o.addr = "(o'chirilgan)"; o.desc = "(o'chirilgan)"; }
    });
    delete DB.masters[u.id];
    u.name = "O'chirilgan foydalanuvchi"; u.phone = 'x' + u.id; u.pw = pwHash('x' + Math.random()); u.deleted = 1;
    DB.session = null; save(); toast("Akkauntingiz va shaxsiy ma'lumotlaringiz o'chirildi."); go('#/'); return;
  }
  if (name === 'report') {
    var reason = String(fd.get('reason') || ''), target = +ds.target, kind = ds.kind;
    if ((kind !== 'master' && kind !== 'review') || REASONS.indexOf(reason) < 0) return toast("Shikoyatni yuborib bo'lmadi.");
    var dup = DB.reports.some(function (r) { return r.kind === kind && r.target === target && r.reporter === u.id && r.status === 'open'; });
    if (!dup) DB.reports.push({id: ++DB.seq.r, kind: kind, target: target, reporter: u.id, reason: reason, status: 'open', created: nowS()});
    save(); toast("Shikoyat yuborildi. Tez orada ko'rib chiqamiz."); render(); return;
  }
}

function onAct(act, ds, btn) {
  var u = me();
  if (act === 'logout') { DB.session = null; save(); go('#/'); return; }
  if (!u) return toast('Avval tizimga kiring.');
  if (act === 'avail' && u.role === 'master' && DB.masters[u.id]) {
    var m = DB.masters[u.id]; m.available = m.available ? 0 : 1; save();
    toast(m.available ? "Holat: hozir bo'shsiz." : 'Holat: hozir bandsiz. Yangi buyurtma kelmaydi.'); render(); return;
  }
  if (act === 'accept' || act === 'done' || act === 'cancel') {
    var o = orderById(ds.id), nw = null;
    if (o && u.role === 'master' && o.masterId === u.id) {
      if (act === 'accept' && o.status === 'new') nw = 'accepted';
      else if (act === 'done' && o.status === 'accepted') nw = 'done';
      else if (act === 'cancel' && (o.status === 'new' || o.status === 'accepted')) nw = 'cancelled';
    } else if (o && u.role === 'client' && o.clientId === u.id && act === 'cancel' && o.status === 'new') nw = 'cancelled';
    if (!nw) return toast("Bu amalni bajarib bo'lmaydi.");
    o.status = nw; save();
    toast({accepted: 'Buyurtma qabul qilindi.', done: 'Ish bajarildi deb belgilandi.', cancelled: 'Buyurtma bekor qilindi.'}[nw]);
    if (nw === 'accepted') render(); else go('#/orders?tab=history'); return;
  }
  if (u.role !== 'admin') return;
  if (act === 'ublock') { var t = userById(+ds.id); if (t && t.role !== 'admin') { t.blocked = t.blocked ? 0 : 1; save(); toast(t.blocked ? 'Foydalanuvchi bloklandi.' : 'Foydalanuvchi blokdan chiqarildi.'); render(); } return; }
  if (act === 'repBlock' || act === 'repClear' || act === 'repClose') {
    var r = DB.reports.filter(function (x) { return x.id === +ds.id; })[0]; if (!r) return;
    if (act === 'repBlock' && r.kind === 'master') { var tu = userById(r.target); if (tu && tu.role !== 'admin') tu.blocked = 1; toast('Usta bloklandi.'); }
    else if (act === 'repClear' && r.kind === 'review') { var ro = orderById(r.target); if (ro) ro.review = null; toast("Sharh matni o'chirildi."); }
    else if (act === 'repClose') toast('Shikoyat yopildi.');
    else return;
    r.status = 'closed'; save(); render(); return;
  }
  if (act === 'reset') {
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1'; btn.textContent = 'Hamma ma\'lumot o\'chadi. Tasdiqlash uchun yana bosing';
      setTimeout(function () { btn.dataset.armed = ''; if (document.body.contains(btn)) render(); }, 4000); return;
    }
    DB = seed(); save(); toast("Demo ma'lumotlar tiklandi. Qayta kiring."); go('#/login');
  }
}

document.addEventListener('submit', function (e) {
  var f = e.target.closest ? e.target.closest('form[data-form]') : null;
  if (!f) return;
  e.preventDefault();
  onForm(f.getAttribute('data-form'), f, new FormData(f), f.dataset);
});
document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (b) { e.preventDefault(); onAct(b.getAttribute('data-act'), b.dataset, b); }
});
document.addEventListener('change', function (e) {
  if (e.target && e.target.name === 'role') {
    var mf = document.getElementById('mf');
    if (mf) mf.classList.toggle('hide', e.target.value !== 'master');
  }
});
window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
render();
})();
</script>
</body></html>
